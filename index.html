<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emoji Crush: Modo Revelação</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            touch-action: manipulation;
        }

        .header { text-align: center; margin-bottom: 15px; }
        h2 { margin: 0 0 5px 0; color: #00d2ff; font-size: 28px; }
        
        #score-board {
            font-size: 16px;
            font-weight: bold;
            background: rgba(30, 20, 35, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid #00d2ff;
            display: inline-block;
            backdrop-filter: blur(5px);
        }

        canvas {
            background-color: #000;
            border: 4px solid #444466;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 210, 255, 0.2);
            cursor: pointer;
            touch-action: none;
        }

        /* O novo painel que fica embaixo do jogo em vez de cobrir a tela */
        #message-panel {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 100px;
        }

        #message-panel h3 { font-size: 32px; margin: 0 0 10px 0; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        #message-panel p { font-size: 16px; margin: 0 0 15px 0; color: #ccc; }
        
        button {
            padding: 12px 24px;
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Emoji Crush</h2>
        <div id="score-board">

        </div>
    </div>

    <!-- O Canvas agora fica livre, sem overlays por cima -->
    <canvas id="game-canvas"></canvas>
    
    <!-- Painel movido para baixo -->
    <div id="message-panel" class="hidden">
        <h3 id="end-title"></h3>
        <p id="end-desc"></p>
        <button id="restartBtn">Jogar Novamente</button>
    </div>

        // ==========================================
        // SINTETIZADOR DE ÁUDIO 8-BITS
        // ==========================================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playTone(frequency, type, duration, delay = 0) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime + delay);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime + delay);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start(audioCtx.currentTime + delay);
            oscillator.stop(audioCtx.currentTime + delay + duration);
        }

        function sfxSelect() { playTone(600, 'sine', 0.1); }
        function sfxError() { playTone(150, 'sawtooth', 0.2); }
        function sfxMatch() {
            playTone(440, 'square', 0.1, 0);      
            playTone(554, 'square', 0.1, 0.08);   
            playTone(659, 'square', 0.2, 0.16);   
        }
        function sfxGameOver() {
            playTone(300, 'sawtooth', 0.3, 0);
            playTone(250, 'sawtooth', 0.3, 0.3);
            playTone(200, 'sawtooth', 0.6, 0.6);
        }
        function sfxWin() {
            playTone(440, 'square', 0.1, 0);
            playTone(554, 'square', 0.1, 0.1);
            playTone(659, 'square', 0.1, 0.2);
            playTone(880, 'square', 0.3, 0.3);
        }

        // ==========================================
        // VARIÁVEIS DO JOGO E NOVO SISTEMA DE MÁSCARA
        // ==========================================
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const remainingEl = document.getElementById('remaining');
        const messagePanel = document.getElementById('message-panel');
        const restartBtn = document.getElementById('restartBtn');
        const endTitle = document.getElementById('end-title');
        const endDesc = document.getElementById('end-desc');

        const ROWS = 8;
        const COLS = 8;
        const CELL_SIZE = 45;
        canvas.width = COLS * CELL_SIZE; 
        canvas.height = ROWS * CELL_SIZE; 

        const CANDIES = ['🍎', '🍇', '🍊', '🫐', '🍋', '🍉'];
        let grid = [];
        let score = 0;
        let selected = null; 
        let isProcessing = false; 
        let bgCanvas = null; 

        // Controle de Revelação
        let revealedGrid = []; 
        let hiddenCount = ROWS * COLS;
        let isGameWon = false;

        // ==========================================
        // DECODIFICADOR DO BACKGROUND
        // ==========================================
        function prepareBackground() {
            if (!BACKGROUND_DATA || BACKGROUND_DATA.trim() === "") return;
            try {
                const parts = BACKGROUND_DATA.split('|');
                if (parts.length < 2) return;
                const dims = parts[0].split(',');
                const w = parseInt(dims[0]);
                const h = parseInt(dims[1]);
                const base64Data = parts[1];

                const binaryString = atob(base64Data);
                
                bgCanvas = document.createElement('canvas');
                bgCanvas.width = w;
                bgCanvas.height = h;
                const bgCtx = bgCanvas.getContext('2d');
                const newImgData = bgCtx.createImageData(w, h);
                const data = newImgData.data;

                for (let i = 0; i < binaryString.length; i++) {
                    const gray = binaryString.charCodeAt(i);
                    const idx = i * 4;
                    data[idx]     = gray;
                    data[idx + 1] = gray;
                    data[idx + 2] = gray;
                    data[idx + 3] = 255;
                }
                bgCtx.putImageData(newImgData, 0, 0);
            } catch (err) {
                console.error("Erro ao decodificar a imagem de fundo:", err);
            }
        }

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================
        function initGame() {
            score = 0;
            hiddenCount = ROWS * COLS;
            isGameWon = false;
            
            scoreEl.textContent = score;
            remainingEl.textContent = hiddenCount;
            messagePanel.classList.add('hidden');
            
            revealedGrid = [];
            for (let r = 0; r < ROWS; r++) {
                let row = [];
                for (let c = 0; c < COLS; c++) {
                    row.push(false);
                }
                revealedGrid.push(row);
            }

            do {
                generateCleanBoard();
            } while (!hasPossibleMoves());

            isProcessing = false;
            drawBoard();
        }

        function generateCleanBoard() {
            grid = [];
            for (let r = 0; r < ROWS; r++) {
                let row = [];
                for (let c = 0; c < COLS; c++) {
                    let randomCandy;
                    do {
                        randomCandy = CANDIES[Math.floor(Math.random() * CANDIES.length)];
                    } while (
                        (c >= 2 && row[c-1] === randomCandy && row[c-2] === randomCandy) ||
                        (r >= 2 && grid[r-1][c] === randomCandy && grid[r-2][c] === randomCandy)
                    );
                    row.push(randomCandy);
                }
                grid.push(row);
            }
        }

        // ==========================================
        // RENDERIZAÇÃO 
        // ==========================================
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // FOTO BASE LÍMPIDA
            if (bgCanvas) {
                ctx.drawImage(bgCanvas, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#222';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // SE VENCEU: Para por aqui, deixando a foto gloriosa à mostra
            if (isGameWon) {
                return; 
            }

            // APLICAÇÃO DOS QUADRADOS E EMOJIS
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const x = c * CELL_SIZE;
                    const y = r * CELL_SIZE;

                    if (revealedGrid[r][c] === true) {
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)'; 
                    } else {
                        ctx.fillStyle = '#000000'; 
                    }
                    ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);

                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);

                    if (selected && selected.r === r && selected.c === c) {
                        ctx.fillStyle = 'rgba(0, 210, 255, 0.3)';
                        ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                        ctx.strokeStyle = '#00d2ff';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(x+2, y+2, CELL_SIZE-4, CELL_SIZE-4);
                    }

                    if (grid[r][c]) {
                        ctx.font = '28px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(grid[r][c], x + CELL_SIZE/2, y + CELL_SIZE/2 + 2);
                    }
                }
            }
        }

        // ==========================================
        // LÓGICA DE JOGO E REVELAÇÃO
        // ==========================================
        function findMatches() {
            let matchedSet = new Set();

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS - 2; c++) {
                    let candy = grid[r][c];
                    if (!candy) continue;
                    let matchLen = 1;
                    while (c + matchLen < COLS && grid[r][c + matchLen] === candy) matchLen++;
                    if (matchLen >= 3) {
                        for (let i = 0; i < matchLen; i++) matchedSet.add(`${r},${c + i}`);
                    }
                }
            }

            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS - 2; r++) {
                    let candy = grid[r][c];
                    if (!candy) continue;
                    let matchLen = 1;
                    while (r + matchLen < ROWS && grid[r + matchLen][c] === candy) matchLen++;
                    if (matchLen >= 3) {
                        for (let i = 0; i < matchLen; i++) matchedSet.add(`${r + i},${c}`);
                    }
                }
            }

            return Array.from(matchedSet).map(str => {
                const parts = str.split(',');
                return { r: parseInt(parts[0]), c: parseInt(parts[1]) };
            });
        }

        function hasPossibleMoves() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (c < COLS - 1) {
                        swapInGrid(r, c, r, c + 1);
                        let matches = findMatches();
                        swapInGrid(r, c, r, c + 1); 
                        if (matches.length > 0) return true;
                    }
                    if (r < ROWS - 1) {
                        swapInGrid(r, c, r + 1, c);
                        let matches = findMatches();
                        swapInGrid(r, c, r + 1, c);
                        if (matches.length > 0) return true; 
                    }
                }
            }
            return false;
        }

        function swapInGrid(r1, c1, r2, c2) {
            let temp = grid[r1][c1];
            grid[r1][c1] = grid[r2][c2];
            grid[r2][c2] = temp;
        }

        function processMatches() {
            let matches = findMatches();
            
            if (matches.length === 0) {
                // LOGICA DE GAME OVER (DERROTA)
                if (!isGameWon && !hasPossibleMoves()) {
                    endTitle.textContent = "Game Over!";
                    endTitle.style.color = "#ff3333";
                    endDesc.textContent = "Sem movimentos possíveis.";
                    endDesc.classList.remove('hidden'); // Garante que a frase de erro apareça
                    sfxGameOver();
                    messagePanel.classList.remove('hidden');
                }
                isProcessing = false; 
                return false; 
            }

            sfxMatch();
            score += matches.length * 10;
            scoreEl.textContent = score;

            let bottomRowExplosions = matches.filter(m => m.r === ROWS - 1).length;

            if (bottomRowExplosions > 0 && hiddenCount > 0) {
                revealRandomCells(bottomRowExplosions);
            }

            matches.forEach(m => { grid[m.r][m.c] = null; });
            drawBoard();

            setTimeout(() => {
                applyGravity();
                drawBoard();
                
                setTimeout(() => {
                    refillBoard();
                    drawBoard();
                    setTimeout(processMatches, 300);
                }, 200);

            }, 300);

            return true;
        }

        function revealRandomCells(quantity) {
            let unrevealedCells = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (revealedGrid[r][c] === false) {
                        unrevealedCells.push({r: r, c: c});
                    }
                }
            }

            let cellsToReveal = Math.min(quantity, unrevealedCells.length);

            for (let i = 0; i < cellsToReveal; i++) {
                let randomIndex = Math.floor(Math.random() * unrevealedCells.length);
                let selectedCell = unrevealedCells.splice(randomIndex, 1)[0];
                
                revealedGrid[selectedCell.r][selectedCell.c] = true;
                hiddenCount--;
            }

            remainingEl.textContent = hiddenCount;

            // LOGICA DE VITÓRIA
            if (hiddenCount === 0 && !isGameWon) {
                isGameWon = true;
                setTimeout(() => {
                    drawBoard(); 
                    sfxWin();
                    
                    endTitle.textContent = "You Won!";
                    endTitle.style.color = "#00ff00";
                    endDesc.classList.add('hidden'); // Remove o texto desnecessário
                    
                    messagePanel.classList.remove('hidden');
                }, 500); 
            }
        }

        function applyGravity() {
            for (let c = 0; c < COLS; c++) {
                let emptySpaces = 0;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (grid[r][c] === null) {
                        emptySpaces++;
                    } else if (emptySpaces > 0) {
                        grid[r + emptySpaces][c] = grid[r][c];
                        grid[r][c] = null;
                    }
                }
            }
        }

        function refillBoard() {
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS; r++) {
                    if (grid[r][c] === null) {
                        grid[r][c] = CANDIES[Math.floor(Math.random() * CANDIES.length)];
                    }
                }
            }
        }

        canvas.addEventListener('pointerdown', function(e) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (isProcessing || isGameWon) return; 

            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            
            const c = Math.floor(x / CELL_SIZE);
            const r = Math.floor(y / CELL_SIZE);

            if (!selected) {
                sfxSelect();
                selected = {r, c};
                drawBoard();
            } else {
                let isAdjacent = Math.abs(selected.r - r) + Math.abs(selected.c - c) === 1;

                if (isAdjacent) {
                    isProcessing = true;
                    
                    let prevR = selected.r;
                    let prevC = selected.c;
                    
                    swapInGrid(prevR, prevC, r, c);
                    selected = null;
                    drawBoard();

                    setTimeout(() => {
                        let matches = findMatches();
                        
                        if (matches.length > 0) {
                            processMatches();
                        } else {
                            sfxError();
                            swapInGrid(r, c, prevR, prevC);
                            isProcessing = false;
                            drawBoard();
                        }
                    }, 250);

                } else {
                    sfxSelect();
                    selected = {r, c};
                    drawBoard();
                }
            }
        });

        restartBtn.addEventListener('click', () => {
            sfxSelect();
            initGame();
        });

        // BOOT DO JOGO
        prepareBackground(); 
        initGame(); 
    </script>
</body>
</html>
