<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Emoji Crush">
    
    <title>Emoji Crush: Modo Campanha</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            touch-action: manipulation;
        }

        /* Correção do UI Bug: Altura fixa para não empurrar o Canvas */
        .header { 
            text-align: center; 
            margin-bottom: 15px; 
            height: 80px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h2 { margin: 0 0 5px 0; color: #00d2ff; font-size: 28px; }
        
        #score-board {
            font-size: 16px;
            font-weight: bold;
            background: rgba(30, 20, 35, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid #00d2ff;
            display: inline-block;
            backdrop-filter: blur(5px);
            white-space: nowrap; /* Impede a quebra de linha no celular */
        }

        /* "Caixas" fixas para os números não balançarem a tela */
        .fixed-num {
            display: inline-block;
            min-width: 35px; 
            text-align: center;
        }

        #loading-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #444466;
            border-top: 5px solid #00d2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        canvas {
            background-color: #000;
            border: 4px solid #444466;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 210, 255, 0.2);
            cursor: pointer;
            touch-action: none;
        }

        #message-panel {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 100px;
        }

        #message-panel h3 { font-size: 32px; margin: 0 0 10px 0; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        #message-panel p { font-size: 16px; margin: 0 0 15px 0; color: #ccc; }
        
        button {
            padding: 12px 24px;
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .hidden { display: none !important; }

        #reset-save-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 12px;
            margin-top: 15px;
            text-decoration: underline;
            padding: 5px;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <h3 id="loading-text">Descompactando Fases...</h3>
    </div>

    <div class="header">
        <h2>Emoji Crush</h2>
        <div id="score-board">
            Fase: <span id="level" class="fixed-num">1</span> | Pts: <span id="score" class="fixed-num">0</span> | Faltam: <span id="remaining" class="fixed-num">64</span>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>
    
    <div id="message-panel" class="hidden">
        <h3 id="end-title"></h3>
        <p id="end-desc"></p>
        <button id="restartBtn">Próxima Fase</button>
        <button id="reset-save-btn" class="hidden">Apagar Progresso e Recomeçar</button>
    </div>

    <script>
        // ==========================================
        // SINTETIZADOR DE ÁUDIO 8-BITS
        // ==========================================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playTone(frequency, type, duration, delay = 0) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime + delay);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime + delay);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start(audioCtx.currentTime + delay);
            oscillator.stop(audioCtx.currentTime + delay + duration);
        }

        function sfxSelect() { playTone(600, 'sine', 0.1); }
        function sfxError() { playTone(150, 'sawtooth', 0.2); }
        function sfxMatch() {
            playTone(440, 'square', 0.1, 0);      
            playTone(554, 'square', 0.1, 0.08);   
            playTone(659, 'square', 0.2, 0.16);   
        }
        function sfxReveal() { // Som brilhante para quando a foto aparece
            playTone(880, 'sine', 0.1, 0);
            playTone(1318, 'sine', 0.15, 0.1);
            playTone(1760, 'sine', 0.2, 0.25);
        }
        function sfxGameOver() {
            playTone(300, 'sawtooth', 0.3, 0);
            playTone(250, 'sawtooth', 0.3, 0.3);
            playTone(200, 'sawtooth', 0.6, 0.6);
        }
        function sfxWin() {
            playTone(440, 'square', 0.1, 0);
            playTone(554, 'square', 0.1, 0.1);
            playTone(659, 'square', 0.1, 0.2);
            playTone(880, 'square', 0.3, 0.3);
        }

        // ==========================================
        // VARIÁVEIS DO JOGO
        // ==========================================
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const remainingEl = document.getElementById('remaining');
        const levelEl = document.getElementById('level');
        const messagePanel = document.getElementById('message-panel');
        const restartBtn = document.getElementById('restartBtn');
        const resetSaveBtn = document.getElementById('reset-save-btn');
        const loadingScreen = document.getElementById('loading-screen');

        const ROWS = 8;
        const COLS = 8;
        const CELL_SIZE = 45;
        canvas.width = COLS * CELL_SIZE; 
        canvas.height = ROWS * CELL_SIZE; 

        const CANDIES = ['🍎', '🍇', '🍊', '🫐', '🍋', '🍉'];
        const CANDY_COLORS = { '🍎':'#ff3b30', '🍇':'#af52de', '🍊':'#ff9500', '🫐':'#007aff', '🍋':'#ffcc00', '🍉':'#ff2d55' };
        
        let grid = [];
        let score = 0;
        let selected = null; 
        let isProcessing = false; 

        let revealedGrid = []; 
        let hiddenCount = ROWS * COLS;
        let isGameWon = false;

        const XOR_KEY = 42;
        let levelImages = []; 
        let currentLevel = 0;

        // Variaveis de Animação
        let particles = [];
        let glows = [];

        // ==========================================
        // MOTOR GRÁFICO (GAME LOOP)
        // ==========================================
        function gameLoop() {
            requestAnimationFrame(gameLoop); // O Jogo agora roda a 60 FPS
            updateAnimations();
            drawBoard();
        }

        function updateAnimations() {
            // Atualiza Explosões
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05; // Vai sumindo
                if (p.life <= 0) particles.splice(i, 1);
            }
            // Atualiza Brilho do Reveal
            for (let i = glows.length - 1; i >= 0; i--) {
                let g = glows[i];
                g.life -= 0.03;
                if (g.life <= 0) glows.splice(i, 1);
            }
        }

        function spawnExplosion(r, c, candy) {
            let color = CANDY_COLORS[candy] || '#ffffff';
            let centerX = c * CELL_SIZE + CELL_SIZE / 2;
            let centerY = r * CELL_SIZE + CELL_SIZE / 2;
            
            // Cria 8 pedacinhos explodindo para os lados
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: centerX,
                    y: centerY,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    life: 1,
                    color: color
                });
            }
        }

        function spawnGlow(r, c) {
            glows.push({ r: r, c: c, life: 1 });
        }

        // ==========================================
        // O DESCOMPACTADOR DO ASSET BUNDLE
        // ==========================================
        async function loadAssetBundle() {
            try {
                const response = await fetch('./assets/sys_config.bin');
                if (!response.ok) throw new Error("Servidor web não encontrado.");
                const buffer = await response.arrayBuffer();
                await processBuffer(buffer);
            } catch (err) {
                loadingScreen.innerHTML = `
                    <div style="text-align: center; padding: 20px;">
                        <h3 style="color: #ff9966; margin-bottom: 10px;">Modo Offline Detectado</h3>
                        <p style="color: #ccc; margin-bottom: 25px; font-size: 14px;">Selecione o arquivo <b>sys_config.bin</b></p>
                        <input type="file" id="offlineFileInput" accept=".bin" style="display: none;">
                        <label for="offlineFileInput" style="padding: 12px 24px; background: #444466; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; border: 2px solid #00d2ff;">
                            Selecionar sys_config.bin
                        </label>
                    </div>
                `;
                document.getElementById('offlineFileInput').addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    loadingScreen.innerHTML = '<div class="spinner"></div><h3 id="loading-text" style="color: white; margin-top: 15px;">Descriptografando...</h3>';
                    const reader = new FileReader();
                    reader.onload = async function(event) { await processBuffer(event.target.result); };
                    reader.readAsArrayBuffer(file);
                });
            }
        }

        async function processBuffer(buffer) {
            try {
                const data = new Uint8Array(buffer);
                for (let i = 0; i < data.length; i++) data[i] = data[i] ^ XOR_KEY;

                let headerEndIndex = -1;
                for (let i = 0; i < data.length; i++) { if (data[i] === 124) { headerEndIndex = i; break; } }
                if (headerEndIndex === -1) throw new Error("Arquivo corrompido.");

                const headerStr = new TextDecoder().decode(data.slice(0, headerEndIndex));
                const imageSizes = headerStr.split(',').map(Number);

                let offset = headerEndIndex + 1;
                for (let i = 0; i < imageSizes.length; i++) {
                    if (imageSizes[i] > 0) {
                        const imgData = data.slice(offset, offset + imageSizes[i]);
                        const url = URL.createObjectURL(new Blob([imgData], { type: 'image/jpeg' }));
                        const img = new Image();
                        img.src = url;
                        await new Promise(resolve => { img.onload = resolve; });
                        levelImages.push(img);
                        offset += imageSizes[i];
                    }
                }
                loadingScreen.classList.add('hidden');
                
                let savedLevel = localStorage.getItem('emojiCrushSave');
                let startingLevel = savedLevel !== null ? parseInt(savedLevel) : 0;
                if (startingLevel >= levelImages.length) { startingLevel = 0; localStorage.setItem('emojiCrushSave', 0); }
                
                initLevel(startingLevel);
            } catch (err) {
                document.getElementById('loading-text').textContent = "Erro ao carregar arquivo!";
                document.getElementById('loading-text').style.color = "red";
            }
        }

        // ==========================================
        // LÓGICA DO JOGO
        // ==========================================
        function initLevel(levelIndex) {
            currentLevel = levelIndex;
            levelEl.textContent = currentLevel + 1;
            score = 0;
            scoreEl.textContent = score;
            startBoard();
        }

        function startBoard() {
            hiddenCount = ROWS * COLS;
            isGameWon = false;
            remainingEl.textContent = hiddenCount;
            messagePanel.classList.add('hidden');
            resetSaveBtn.classList.add('hidden');
            particles = []; glows = []; // Limpa animações ao reiniciar
            
            revealedGrid = [];
            for (let r = 0; r < ROWS; r++) {
                let row = [];
                for (let c = 0; c < COLS; c++) { row.push(false); }
                revealedGrid.push(row);
            }

            do { generateCleanBoard(); } while (!hasPossibleMoves());
            isProcessing = false;
        }

        function generateCleanBoard() {
            grid = [];
            for (let r = 0; r < ROWS; r++) {
                let row = [];
                for (let c = 0; c < COLS; c++) {
                    let randomCandy;
                    do { randomCandy = CANDIES[Math.floor(Math.random() * CANDIES.length)]; } 
                    while ((c >= 2 && row[c-1] === randomCandy && row[c-2] === randomCandy) ||
                           (r >= 2 && grid[r-1][c] === randomCandy && grid[r-2][c] === randomCandy));
                    row.push(randomCandy);
                }
                grid.push(row);
            }
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Fundo da Fase
            if (levelImages[currentLevel]) {
                ctx.drawImage(levelImages[currentLevel], 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#222'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 2. Animação de Brilho (Por baixo dos blocos escuros)
            glows.forEach(g => {
                ctx.fillStyle = `rgba(255, 255, 200, ${g.life})`;
                ctx.fillRect(g.c * CELL_SIZE, g.r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            });

            if (isGameWon) return; 

            // 3. Blocos e Emojis
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const x = c * CELL_SIZE; const y = r * CELL_SIZE;

                    if (revealedGrid[r][c] === true) ctx.fillStyle = 'rgba(0, 0, 0, 0.65)'; 
                    else ctx.fillStyle = '#000000'; 
                    
                    ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                    ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);

                    if (selected && selected.r === r && selected.c === c) {
                        ctx.fillStyle = 'rgba(0, 210, 255, 0.3)';
                        ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                        ctx.strokeStyle = '#00d2ff'; ctx.lineWidth = 3;
                        ctx.strokeRect(x+2, y+2, CELL_SIZE-4, CELL_SIZE-4);
                    }

                    if (grid[r][c]) {
                        ctx.font = '28px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText(grid[r][c], x + CELL_SIZE/2, y + CELL_SIZE/2 + 2);
                    }
                }
            }

            // 4. Animação de Explosão de Partículas (Por cima de tudo)
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x - 3, p.y - 3, 6, 6); // Partículas quadradas de 6px
                ctx.globalAlpha = 1.0;
            });
        }

        function findMatches() {
            let matchedSet = new Set();
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS - 2; c++) {
                    let candy = grid[r][c];
                    if (!candy) continue;
                    let matchLen = 1;
                    while (c + matchLen < COLS && grid[r][c + matchLen] === candy) matchLen++;
                    if (matchLen >= 3) { for (let i = 0; i < matchLen; i++) matchedSet.add(`${r},${c + i}`); }
                }
            }
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS - 2; r++) {
                    let candy = grid[r][c];
                    if (!candy) continue;
                    let matchLen = 1;
                    while (r + matchLen < ROWS && grid[r + matchLen][c] === candy) matchLen++;
                    if (matchLen >= 3) { for (let i = 0; i < matchLen; i++) matchedSet.add(`${r + i},${c}`); }
                }
            }
            return Array.from(matchedSet).map(str => {
                const parts = str.split(','); return { r: parseInt(parts[0]), c: parseInt(parts[1]) };
            });
        }

        function hasPossibleMoves() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (c < COLS - 1) {
                        swapInGrid(r, c, r, c + 1);
                        let matches = findMatches();
                        swapInGrid(r, c, r, c + 1); 
                        if (matches.length > 0) return true;
                    }
                    if (r < ROWS - 1) {
                        swapInGrid(r, c, r + 1, c);
                        let matches = findMatches();
                        swapInGrid(r, c, r + 1, c);
                        if (matches.length > 0) return true; 
                    }
                }
            }
            return false;
        }

        function swapInGrid(r1, c1, r2, c2) {
            let temp = grid[r1][c1]; grid[r1][c1] = grid[r2][c2]; grid[r2][c2] = temp;
        }

        function processMatches() {
            let matches = findMatches();
            
            if (matches.length === 0) {
                if (!isGameWon && !hasPossibleMoves()) {
                    document.getElementById('end-title').textContent = "Sem Movimentos";
                    document.getElementById('end-title').style.color = "#ff3333";
                    document.getElementById('end-desc').textContent = "O tabuleiro travou.";
                    document.getElementById('end-desc').classList.remove('hidden');
                    restartBtn.textContent = "Tentar Fase Novamente";
                    if (currentLevel > 0) resetSaveBtn.classList.remove('hidden');
                    sfxGameOver();
                    messagePanel.classList.remove('hidden');
                }
                isProcessing = false; 
                return false; 
            }

            sfxMatch();
            score += matches.length * 10;
            scoreEl.textContent = score;

            let bottomRowExplosions = matches.filter(m => m.r === ROWS - 1).length;
            if (bottomRowExplosions > 0 && hiddenCount > 0) {
                revealRandomCells(bottomRowExplosions);
            }

            // Ativa o gatilho das partículas antes de remover as frutas!
            matches.forEach(m => { 
                spawnExplosion(m.r, m.c, grid[m.r][m.c]);
                grid[m.r][m.c] = null; 
            });

            setTimeout(() => {
                applyGravity();
                setTimeout(() => {
                    refillBoard();
                    setTimeout(processMatches, 300);
                }, 200);
            }, 300);
            return true;
        }

        function revealRandomCells(quantity) {
            let unrevealedCells = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (revealedGrid[r][c] === false) unrevealedCells.push({r: r, c: c});
                }
            }

            let cellsToReveal = Math.min(quantity, unrevealedCells.length);
            
            // Se ele conseguiu revelar pelo menos um bloco, toca o som especial
            if (cellsToReveal > 0) sfxReveal(); 

            for (let i = 0; i < cellsToReveal; i++) {
                let randomIndex = Math.floor(Math.random() * unrevealedCells.length);
                let selectedCell = unrevealedCells.splice(randomIndex, 1)[0];
                revealedGrid[selectedCell.r][selectedCell.c] = true;
                
                spawnGlow(selectedCell.r, selectedCell.c); // Cria o brilho na coordenada!
                hiddenCount--;
            }

            remainingEl.textContent = hiddenCount;

            if (hiddenCount === 0 && !isGameWon) {
                isGameWon = true;
                setTimeout(() => {
                    sfxWin();
                    if (currentLevel < levelImages.length - 1) {
                        document.getElementById('end-title').textContent = "Fase Concluída!";
                        document.getElementById('end-title').style.color = "#00ff00";
                        document.getElementById('end-desc').classList.add('hidden');
                        restartBtn.textContent = "Próxima Fase";
                    } else {
                        document.getElementById('end-title').textContent = "Zeradou!";
                        document.getElementById('end-title').style.color = "#ffdd00";
                        document.getElementById('end-desc').textContent = "Você terminou todas as imagens!";
                        document.getElementById('end-desc').classList.remove('hidden');
                        restartBtn.textContent = "Jogar Tudo de Novo";
                    }
                    messagePanel.classList.remove('hidden');
                }, 500); 
            }
        }

        function applyGravity() {
            for (let c = 0; c < COLS; c++) {
                let emptySpaces = 0;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (grid[r][c] === null) { emptySpaces++; } 
                    else if (emptySpaces > 0) {
                        grid[r + emptySpaces][c] = grid[r][c];
                        grid[r][c] = null;
                    }
                }
            }
        }

        function refillBoard() {
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS; r++) {
                    if (grid[r][c] === null) grid[r][c] = CANDIES[Math.floor(Math.random() * CANDIES.length)];
                }
            }
        }

        canvas.addEventListener('pointerdown', function(e) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (isProcessing || isGameWon) return; 

            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            
            const c = Math.floor(x / CELL_SIZE); const r = Math.floor(y / CELL_SIZE);

            if (!selected) {
                sfxSelect(); selected = {r, c};
            } else {
                let isAdjacent = Math.abs(selected.r - r) + Math.abs(selected.c - c) === 1;
                if (isAdjacent) {
                    isProcessing = true;
                    let prevR = selected.r; let prevC = selected.c;
                    swapInGrid(prevR, prevC, r, c);
                    selected = null;

                    setTimeout(() => {
                        let matches = findMatches();
                        if (matches.length > 0) {
                            processMatches();
                        } else {
                            sfxError();
                            swapInGrid(r, c, prevR, prevC);
                            isProcessing = false;
                        }
                    }, 250);
                } else {
                    sfxSelect(); selected = {r, c};
                }
            }
        });

        restartBtn.addEventListener('click', () => {
            sfxSelect();
            if (hiddenCount === 0) {
                if (currentLevel < levelImages.length - 1) {
                    let nextLevel = currentLevel + 1;
                    localStorage.setItem('emojiCrushSave', nextLevel);
                    initLevel(nextLevel);
                } else {
                    localStorage.setItem('emojiCrushSave', 0);
                    initLevel(0);
                }
            } else { startBoard(); }
        });

        resetSaveBtn.addEventListener('click', () => {
            if(confirm("Tem certeza que deseja apagar seu progresso e voltar para a Fase 1?")) {
                localStorage.setItem('emojiCrushSave', 0); initLevel(0);
            }
        });

        // Inicia o Game Loop imediatamente
        requestAnimationFrame(gameLoop);
        // Tenta baixar o arquivo
        loadAssetBundle();

    </script>
</body>
</html>
